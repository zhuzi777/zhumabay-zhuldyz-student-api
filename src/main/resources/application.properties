spring.application.name=zhumabay-zhuldyz-student-api
server.port=${SERVER_PORT:8080}

# Personal data shown at /api/info
student.author=Zhuldyz Zhumabay
student.group=IT2-2308

# Database settings come from environment variables (see docker-compose.yml / .env).
# Inside Docker Compose DB_HOST is the service name "postgres", never localhost.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:studentdb}
spring.datasource.username=${DB_USER:student}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
